name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and deterministic e2e rig tests
        run: python -m unittest discover -s tests -v

  windows-auto-allow:
    # Experimental: can a hosted Windows runner show Chrome's
    # "Allow remote debugging?" prompt for the pywinauto backend to press?
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pywinauto
        run: python -m pip install pywinauto
      - name: Try the prompt and the Windows backend
        shell: pwsh
        env:
          JOB_AGENT_AUTO_ALLOW_WINDOWS: "1"
          JOB_AGENT_HOME: ${{ runner.temp }}\job-agent
        run: python tests/e2e/windows_auto_allow_probe.py
